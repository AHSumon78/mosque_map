version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mosque_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: mosque_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: mosque_web_api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root_password_here
      DB_NAME: mosque_db
      DB_PORT: 3306
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  mysql_data:
